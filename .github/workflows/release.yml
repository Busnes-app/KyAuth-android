name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Signing secrets live in this environment; give it a required reviewer.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No Gradle cache: a release must not restore state another ref wrote.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Tag matches versionName
        run: |
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          [[ "$GITHUB_REF_NAME" == "v$name" ]] || { echo "tag $GITHUB_REF_NAME != versionName $name"; exit 1; }
      - name: Build signed APKs and the Play bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.KYAUTH_KEYSTORE_BASE64 }}
          KYAUTH_STORE_PASSWORD: ${{ secrets.KYAUTH_STORE_PASSWORD }}
          KYAUTH_KEY_ALIAS: ${{ secrets.KYAUTH_KEY_ALIAS }}
          KYAUTH_KEY_PASSWORD: ${{ secrets.KYAUTH_KEY_PASSWORD }}
        run: |
          export KYAUTH_KEYSTORE="$RUNNER_TEMP/release.jks"
          base64 -d <<<"$KEYSTORE_BASE64" > "$KYAUTH_KEYSTORE"
          ./gradlew assembleGithubRelease assembleFdroidRelease bundlePlayRelease
          rm "$KYAUTH_KEYSTORE"
      # An unsigned APK is named *-unsigned.apk, so a missing secret fails the copy; apksigner
      # proves the signature and prints the certificate digest for the notes.
      - name: Verify and stage
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          mkdir dist
          for channel in github fdroid; do
            cp "app/build/outputs/apk/$channel/release/app-$channel-release.apk" "dist/kyauth-$GITHUB_REF_NAME-$channel.apk"
          done
          for apk in dist/*.apk; do "$apksigner" verify "$apk"; done
          digest=$("$apksigner" verify --print-certs dist/kyauth-"$GITHUB_REF_NAME"-github.apk | grep -oP 'SHA-256 digest: \K\w+' | head -1)
          [[ -n "$digest" ]]
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          (cd dist && sha256sum *.apk > SHA256SUMS)
      # jarsigner exits 0 on an unsigned bundle, so match its verdict.
      - name: Verify and stage the Play bundle
        run: |
          aab=app/build/outputs/bundle/playRelease/app-play-release.aab
          jarsigner -verify "$aab" | grep -x 'jar verified.'
          mkdir -p play/whatsnew
          cp "$aab" app/build/outputs/mapping/playRelease/mapping.txt play/
          code=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          cp "fastlane/metadata/android/en-US/changelogs/$code.txt" play/whatsnew/whatsnew-en-US
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-bundle
          path: play/
          retention-days: 7
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --notes "Signing certificate SHA-256: \`$DIGEST\`. Play builds are signed by Google Play and carry a different certificate."

  # Its own job, so a failed upload re-runs alone instead of re-publishing the GitHub release.
  play:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    # Job-level `if` cannot read secrets, so each step checks this instead.
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - if: env.PLAY_JSON == ''
        run: echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is unset; upload the play-bundle artifact by hand."
      - if: env.PLAY_JSON != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: play-bundle
      # Internal track only: promote to closed testing or production in Play Console.
      - if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_JSON }}
          packageName: org.kysecurity.authenticator
          releaseFiles: app-play-release.aab
          mappingFile: mapping.txt
          whatsNewDirectory: whatsnew
          track: internal
          status: completed
