name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede a pull request's older run; every other run gets its own group so none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      # Caches are written from main only; PRs read them.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable Gradle build and configuration caches
        run: printf 'org.gradle.caching=true\norg.gradle.configuration-cache=true\n' >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
      # gradle-wrapper.jar is a committed binary: check it against Gradle's published checksums.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Release APKs are unsigned here: the build signs only when the KYAUTH_* signing material exists.
      - run: >-
          ./gradlew testPlayDebugUnitTest testGithubDebugUnitTest testFdroidDebugUnitTest
          lintPlayDebug lintGithubDebug lintFdroidDebug
          assemblePlayRelease assembleGithubRelease assembleFdroidRelease
          compilePlayDebugAndroidTestSources
      - name: F-Droid build carries no Google Play code
        run: |
          deps=$(./gradlew -q :app:dependencies --configuration fdroidReleaseRuntimeClasspath)
          if grep -E 'com\.google\.(firebase|android\.gms|mlkit)' <<<"$deps"; then exit 1; fi

  device:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [Play, Fdroid]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      # Caches are written from main only; PRs read them.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable Gradle build and configuration caches
        run: printf 'org.gradle.caching=true\norg.gradle.configuration-cache=true\n' >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
      # Separate runner: validate here too, before the emulator script runs ./gradlew.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Compile while the fixtures run and the emulator boots; the device run reuses the outputs.
      - name: Start debug build
        run: (./gradlew --no-daemon assemble${{ matrix.channel }}Debug assemble${{ matrix.channel }}DebugAndroidTest; echo $? > "$RUNNER_TEMP/prebuild.rc") > "$RUNNER_TEMP/prebuild.log" 2>&1 &
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false # Standard-library fixture has no module dependencies or go.sum.
      - name: Calibrate native TLS peers
        working-directory: scripts/tls-fixtures
        run: GODEBUG=fips140=off go test -race -count=1 ./...
      - run: shellcheck scripts/test-android.sh
      - run: python3 scripts/test-native-tls-gate.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          profile: pixel_6
          arch: x86_64
          script: |
            adb shell settings put system screen_off_timeout 2147483647
            adb shell svc power stayon true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            # A cold-booted launcher can ANR; its dialog would steal window focus from the UI tests.
            # Hide future error dialogs, then restart the launcher to drop one already showing.
            adb shell settings put global hide_error_dialogs 1
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true
            # No PIN here: SecureLockScreen sets one only around the Keystore tests, so no PIN
            # keyguard can interrupt the UI tests.
            until [ -f "$RUNNER_TEMP/prebuild.rc" ]; do sleep 5; done; cat "$RUNNER_TEMP/prebuild.log"; exit "$(cat "$RUNNER_TEMP/prebuild.rc")"
            scripts/test-android.sh "$(adb get-serialno)" ${{ matrix.channel }}
      # Keep passing and failing native counters alongside the complete device report.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-results-${{ matrix.channel }}
          include-hidden-files: true
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            .tls-fixtures/run.*/ready.json
            .tls-fixtures/run.*/fixture-stats.json
            .tls-fixtures/run.*/fixture.log
            .tls-fixtures/run.*/native-tls.log
            .tls-fixtures/run.*/run-info.json
            .tls-fixtures/run.*/android-test-results/
            .tls-fixtures/run.*/native-tls-gate.txt
          retention-days: 7
